; PlatformIO Project Configuration File
; ESP32-S3 N16R8 patient-monitoring node and TMP117 raw diagnostic

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino

; Serial Monitor & Upload Speeds
monitor_speed = 115200
upload_speed = 460800

; Release GPIO 0 / avoid holding the ESP32 in reset on USB-UART bridges.
monitor_dtr = 0
monitor_rts = 0
monitor_filters =
    esp32_exception_decoder
    direct

; 16 MB QIO flash and 8 MB OPI PSRAM are defined in
; boards/esp32-s3-devkitc-1-n16r8.json. Do not silently fall back to the N8
; board definition: that would remove PSRAM and use an 8 MB partition table.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DRPM_VERBOSE_TELEMETRY=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DRPM_ENABLE_OPTIONAL_SHT40=0
    -DRPM_ENABLE_OPTIONAL_MLX90614=0

; Required libraries for the installed build. The optional SHT40/MLX90614
; drivers are not installed or required. If a developer deliberately enables
; those legacy flags, add their two libraries back and test on hardware:
;   adafruit/Adafruit MLX90614 Library @ ^2.1.5
;   adafruit/Adafruit SHT4x Library @ ^1.0.5
; TMP117 and MPU-6050 use checked raw I2C transactions in src/main.cpp.
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
