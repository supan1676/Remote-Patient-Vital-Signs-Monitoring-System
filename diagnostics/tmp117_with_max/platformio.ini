; Focused diagnostic: does MAX30102 activity make TMP117 disappear?
; Run from the repository root:
;   pio run -d diagnostics/tmp117_with_max
;   pio run -d diagnostics/tmp117_with_max -t upload --upload-port COMx
;   pio device monitor -d diagnostics/tmp117_with_max --port COMx

[platformio]
boards_dir = ../../boards

[env:tmp117-max-diag]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DDIAG_ENABLE_MAX=1
    -DDIAG_ENABLE_OLED=0
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; The default environment above mirrors the main firmware's production LED
; current (stage 3). These explicit stage environments make the isolation test
; repeatable without editing source:
;   stage 1: MAX begin/identity only, no setup and no LED writes
;   stage 2: full MAX setup, red/IR pulse amplitude 0x00
;   stage 3: full MAX setup, red/IR pulse amplitude 0x24 (production)
[env:tmp117-max-stage1]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DDIAG_ENABLE_MAX=1
    -DDIAG_ENABLE_OLED=0
    -DDIAG_MAX_STAGE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

