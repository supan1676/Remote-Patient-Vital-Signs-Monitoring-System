; Standalone TMP117 raw-register diagnostic.
; Run from the repository root:
;   pio run -d diagnostics/tmp117_raw
;   pio run -d diagnostics/tmp117_raw -t upload --upload-port COMx
;   pio device monitor -d diagnostics/tmp117_raw --port COMx

[platformio]
boards_dir = ../../boards

[env:tmp117-diagnostic]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0
