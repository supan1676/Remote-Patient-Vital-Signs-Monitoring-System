name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node tests/dashboard_core.test.js
      - run: node --check assets/dashboard.js
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ['.', diagnostics/tmp117_raw, diagnostics/tmp117_with_max]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -d '${{ matrix.project }}'
